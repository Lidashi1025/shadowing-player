[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowing-player"
version = "0.2.0"
description = "Local Windows player for sentence-level language shadowing with bilingual subtitles and offline ASR"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.15"
authors = [{ name = "Lidashi1025" }]
keywords = ["shadowing", "language-learning", "subtitles", "mpv", "windows", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Multimedia :: Video :: Display",
]
dependencies = [
    "PySide6==6.11.1",
    "python-mpv==1.0.8",
    "pysubs2==1.8.1",
    "faster-whisper==1.2.1",
]

[project.urls]
Homepage = "https://github.com/Lidashi1025/shadowing-player"
Repository = "https://github.com/Lidashi1025/shadowing-player"
Issues = "https://github.com/Lidashi1025/shadowing-player/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<10",
    "pytest-qt==4.5.0",
    "pyinstaller==6.21.0",
    "pillow>=11,<13",
]

[project.scripts]
shadowing-player = "shadowing_player.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
