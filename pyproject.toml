[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowing-player"
version = "0.2.0"
description = "Windows 本机儿童影子跟读播放器"
requires-python = ">=3.12,<3.15"
dependencies = [
    "PySide6==6.11.1",
    "python-mpv==1.0.8",
    "pysubs2==1.8.1",
    "faster-whisper==1.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<10",
    "pytest-qt==4.5.0",
    "pyinstaller==6.21.0",
    "pillow>=11,<13",
]

[project.scripts]
shadowing-player = "shadowing_player.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
